services:
  - type: web
    name: higlowcloud-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: higlowcloud-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        value: ""
      - key: FRONTEND_ORIGIN
        value: https://higlowcloud.onrender.com
      - key: MAX_UPLOAD_MB
        value: "20"
      - key: UPLOAD_DIR
        value: /tmp/higlowcloud/uploads
      - key: APP_ENV
        value: production
      # Nenva Call identity verification (email + SMS).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        sync: false
      # Add a paid TURN service for reliable calling across restrictive NATs.
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false

  - type: web
    name: higlowcloud
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://higlowcloud-api.onrender.com/api/v1

databases:
  - name: higlowcloud-db
    plan: free
    databaseName: higlowcloud
    user: higlowcloud
