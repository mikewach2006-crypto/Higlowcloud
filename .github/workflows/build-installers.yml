name: Build and publish Higlowbiz installers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: higlowbiz-installer-release
  cancel-in-progress: false

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out installer project
        uses: actions/checkout@v4
      - name: Check out private Higlowbiz source
        uses: actions/checkout@v4
        with:
          repository: mikewach2006-crypto/HiglowBiz
          ref: main
          token: ${{ secrets.HIGLOWBIZ_SOURCE_TOKEN }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: source/frontend
        run: npm ci
      - name: Build Windows EXE
        working-directory: source/frontend
        run: npm run desktop:win
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: higlowbiz-windows
          path: source/frontend/release/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out installer project
        uses: actions/checkout@v4
      - name: Check out private Higlowbiz source
        uses: actions/checkout@v4
        with:
          repository: mikewach2006-crypto/HiglowBiz
          ref: main
          token: ${{ secrets.HIGLOWBIZ_SOURCE_TOKEN }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install frontend dependencies
        working-directory: source/frontend
        run: npm ci
      - name: Create Android project if it is not committed
        working-directory: source/frontend
        shell: bash
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
      - name: Build Android debug APK
        working-directory: source/frontend
        shell: bash
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: higlowbiz-android
          path: source/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish public installers
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: higlowbiz-windows
          path: release-assets
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: higlowbiz-android
          path: release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Higlowbiz installers v1.0.${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
