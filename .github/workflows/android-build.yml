name: HiglowCloud Android build
run-name: "HiglowCloud Android build #${{ inputs.build_id }}"

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: HiglowCloud build ID
        required: true
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: higlowcloud-android-builds
  cancel-in-progress: false

jobs:
  android:
    name: Build Android application
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Claim build and clone private source
        id: claim
        env:
          BUILD_ID: ${{ inputs.build_id }}
          RUN_ID: ${{ github.run_id }}
          API_URL: https://higlowcloud-api.onrender.com/api/v1
        run: |
          python3 - <<'PY'
          import base64, json, os, shutil, subprocess, urllib.request
          payload = json.dumps({"build_id": os.environ["BUILD_ID"], "run_id": str(os.environ["RUN_ID"])}).encode()
          request = urllib.request.Request(
              os.environ["API_URL"] + "/android-builds/internal/claim",
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              build = json.loads(response.read())["build"]
          repository = build["repository"]
          branch = build["branch"]
          token = build["source_token"]
          encoded = base64.b64encode(("x-access-token:" + token).encode()).decode()
          command = [
              "git", "-c", "http.extraheader=AUTHORIZATION: basic " + encoded,
              "clone", "--depth", "1", "--branch", branch,
              "https://github.com/" + repository + ".git", "source",
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("claimed=true\\n")
              output.write("target=" + build["target"] + "\\n")
              output.write("build_id=" + build["id"] + "\\n")
          subprocess.run(command, check=True, capture_output=True, text=True, timeout=300)
          shutil.rmtree("source/.git", ignore_errors=True)
          print("Private source checkout completed. Short-lived repository credentials were discarded.")
          PY

      - name: Set up Java 17
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        if: steps.claim.outputs.claimed == 'true'
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK packages
        if: steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        if: steps.claim.outputs.claimed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Test and build requested Nenva APK
        id: build
        if: steps.claim.outputs.claimed == 'true'
        env:
          TARGET: ${{ steps.claim.outputs.target }}
          BUILD_ID: ${{ steps.claim.outputs.build_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd source/apps/nenva-android
          case "$TARGET" in
            callDebug)
              gradle --no-daemon :app:testCallDebugUnitTest :app:assembleCallDebug
              ;;
            unifiedDebug)
              gradle --no-daemon :app:testUnifiedDebugUnitTest :app:assembleUnifiedDebug
              ;;
            *)
              echo "Unsupported build target."
              exit 2
              ;;
          esac
          mkdir -p build-output
          find app/build/outputs/apk -type f -name '*.apk' -exec cp '{}' build-output/ \;
          test -n "$(find build-output -maxdepth 1 -type f -name '*.apk' -print -quit)"
          sha256sum build-output/*.apk > build-output/SHA256SUMS
          printf 'Build ID: %s\nTarget: %s\n' "$BUILD_ID" "$TARGET" > build-output/BUILD-INFO.txt

      - name: Store private APK artifact
        id: upload
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: higlowcloud-android-${{ inputs.build_id }}
          path: source/apps/nenva-android/build-output/
          if-no-files-found: error
          retention-days: 7

      - name: Report build result to HiglowCloud
        if: always() && steps.claim.outputs.claimed == 'true'
        env:
          BUILD_ID: ${{ inputs.build_id }}
          RUN_ID: ${{ github.run_id }}
          API_URL: https://higlowcloud-api.onrender.com/api/v1
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          success = os.environ.get("BUILD_OUTCOME") == "success" and os.environ.get("UPLOAD_OUTCOME") == "success"
          payload = {
              "build_id": os.environ["BUILD_ID"],
              "run_id": str(os.environ["RUN_ID"]),
              "status": "succeeded" if success else "failed",
              "error": "" if success else "The Android build or private artifact upload did not complete successfully. Open the workflow run for the exact step log.",
          }
          request = urllib.request.Request(
              os.environ["API_URL"] + "/android-builds/internal/complete",
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print("HiglowCloud build status:", json.loads(response.read()).get("status"))
          PY
